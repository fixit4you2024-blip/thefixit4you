<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="light" cx="82%" cy="6%" r="80%">
      <stop offset="0" stop-color="#2a8fd0" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#0c3552" stop-opacity=".32"/>
      <stop offset="1" stop-color="#03070b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="8%" cy="96%" r="55%">
      <stop offset="0" stop-color="#fcb040" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fcb040" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b7782"/>
      <stop offset=".35" stop-color="#d9e2e8"/>
      <stop offset=".6" stop-color="#5b6670"/>
      <stop offset="1" stop-color="#2a3138"/>
    </linearGradient>
    <linearGradient id="glassNew" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16222e"/>
      <stop offset=".45" stop-color="#05080b"/>
      <stop offset="1" stop-color="#0f1820"/>
    </linearGradient>
    <linearGradient id="glassOld" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1414"/>
      <stop offset=".5" stop-color="#070506"/>
      <stop offset="1" stop-color="#140d0d"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset=".35" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a5a22"/>
      <stop offset=".5" stop-color="#f1cf86"/>
      <stop offset="1" stop-color="#6e5020"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5d6b77"/>
      <stop offset=".5" stop-color="#dfe8ee"/>
      <stop offset="1" stop-color="#4c5964"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
    <pattern id="mat" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0v48" fill="none" stroke="#29aae1" stroke-opacity=".1" stroke-width="1.3"/></pattern>
    <clipPath id="oldClip"><rect x="0" y="0" width="300" height="620" rx="46"/></clipPath>
  </defs>

  <!-- dark repair mat -->
  <rect width="1200" height="900" fill="#04080c"/>
  <rect width="1200" height="900" fill="url(#mat)"/>
  <!-- mat trays -->
  <g fill="none" stroke="#29aae1" stroke-opacity=".22" stroke-width="2">
    <rect x="60" y="40" width="300" height="110" rx="18"/>
    <rect x="390" y="40" width="300" height="110" rx="18"/>
  </g>
  <rect width="1200" height="900" fill="url(#light)"/>
  <rect width="1200" height="900" fill="url(#warm)"/>

  <!-- shadows -->
  <ellipse cx="290" cy="840" rx="190" ry="26" fill="#000" opacity=".7" filter="url(#soft)"/>
  <ellipse cx="640" cy="840" rx="190" ry="26" fill="#000" opacity=".7" filter="url(#soft)"/>

  <!-- OLD cracked display -->
  <g transform="translate(140 200) rotate(-3 150 310)">
    <rect x="-8" y="-8" width="316" height="636" rx="52" fill="#0b0d10" stroke="#3a2a2a" stroke-width="2"/>
    <g clip-path="url(#oldClip)">
      <rect width="300" height="620" fill="url(#glassOld)"/>
      <!-- cracks radiating from impact point -->
      <g fill="none" stroke="#e9eef2" stroke-opacity=".55" stroke-width="1.6" stroke-linecap="round">
        <path d="M206 70l-40 60-50 20-70 70-60 30"/>
        <path d="M206 70l30 80 10 90 40 70"/>
        <path d="M206 70l-90 -40-80 -40"/>
        <path d="M206 70l60 -30 50 -10"/>
        <path d="M166 130l-20 110 -50 90 -30 120 -40 80"/>
        <path d="M116 150l-30 -70"/>
        <path d="M246 240l-80 60 -40 100 -10 120"/>
        <path d="M46 220l70 40 50 40"/>
        <path d="M286 310l-60 70 -20 90 20 120"/>
        <path d="M206 70l-10 -70"/>
      </g>
      <g fill="none" stroke="#ffffff" stroke-opacity=".25" stroke-width="1">
        <path d="M206 70m-18 0a18 18 0 1 0 36 0a18 18 0 1 0 -36 0"/>
        <path d="M206 70m-38 0a38 30 0 1 0 76 0a38 30 0 1 0 -76 0"/>
      </g>
      <!-- dead-pixel bleed -->
      <path d="M0 360c40-20 80 10 120-10s70 30 100 20 60-10 80 0v250H0z" fill="#3a0d12" opacity=".35"/>
      <rect width="300" height="620" fill="url(#sheen)"/>
    </g>
    <rect x="110" y="16" width="80" height="22" rx="11" fill="#000"/>
  </g>
  <!-- label: before -->
  <g transform="translate(200 128)">
    <rect width="160" height="42" rx="21" fill="#1a0f0f" stroke="#ff7b6b" stroke-opacity=".6"/>
    <text x="80" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffb3a8" letter-spacing="2">CRACKED</text>
  </g>

  <!-- NEW display -->
  <g transform="translate(490 196)">
    <rect x="-10" y="-10" width="320" height="640" rx="54" fill="url(#frame)"/>
    <rect width="300" height="620" rx="46" fill="url(#glassNew)" stroke="#5cc4ee" stroke-opacity=".7" stroke-width="2" filter="url(#glow)"/>
    <rect x="110" y="16" width="80" height="22" rx="11" fill="#000"/>
    <!-- protective film bubbles -->
    <g fill="#9fb0bd" opacity=".16">
      <circle cx="80" cy="110" r="10"/><circle cx="210" cy="190" r="16"/><circle cx="120" cy="300" r="22"/><circle cx="240" cy="420" r="12"/><circle cx="70" cy="470" r="14"/><circle cx="180" cy="540" r="9"/>
    </g>
    <path d="M24 28c80-26 180-26 250 10" fill="none" stroke="#bfe9fb" stroke-opacity=".55" stroke-width="2"/>
    <rect width="300" height="620" rx="46" fill="url(#sheen)"/>
  </g>
  <g transform="translate(560 124)">
    <rect width="160" height="42" rx="21" fill="#071a26" stroke="#5cc4ee" stroke-opacity=".8"/>
    <text x="80" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#9fe0fb" letter-spacing="2">NEW</text>
  </g>

  <!-- precision screwdrivers -->
  <g transform="rotate(30 1000 300)">
    <rect x="900" y="150" width="34" height="230" rx="8" fill="url(#brass)"/>
    <rect x="912" y="380" width="10" height="90" fill="url(#steel)"/>
    <rect x="955" y="170" width="34" height="230" rx="8" fill="url(#brass)"/>
    <rect x="967" y="400" width="10" height="90" fill="url(#steel)"/>
    <rect x="1010" y="190" width="34" height="230" rx="8" fill="url(#brass)"/>
    <rect x="1022" y="420" width="10" height="90" fill="url(#steel)"/>
    <g stroke="#3a2a10" stroke-opacity=".5" stroke-width="2"><path d="M906 170v190M961 190v190M1016 210v190"/></g>
  </g>
  <!-- pry tool -->
  <g transform="rotate(8 980 700)">
    <rect x="900" y="540" width="70" height="300" rx="10" fill="#0e1720" stroke="#29aae1" stroke-opacity=".6" stroke-width="2"/>
    <path d="M915 820h40l-8 50h-24z" fill="url(#steel)"/>
    <text x="935" y="700" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#29aae1" opacity=".7" transform="rotate(-90 935 700)">fixit4u</text>
  </g>
  <!-- screws -->
  <g fill="#8fa1ae" stroke="#dfe8ee" stroke-width="1"><circle cx="860" cy="760" r="7"/><circle cx="882" cy="790" r="6"/><circle cx="460" cy="860" r="6"/></g>
</svg>
