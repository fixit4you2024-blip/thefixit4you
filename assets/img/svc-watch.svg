<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="light" cx="80%" cy="10%" r="75%">
      <stop offset="0" stop-color="#e08a1e" stop-opacity=".5"/>
      <stop offset=".45" stop-color="#4a2a08" stop-opacity=".35"/>
      <stop offset="1" stop-color="#05070a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pool" cx="64%" cy="55%" r="42%">
      <stop offset="0" stop-color="#fcb040" stop-opacity=".18"/>
      <stop offset="1" stop-color="#fcb040" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a646e"/>
      <stop offset=".35" stop-color="#d6dde3"/>
      <stop offset=".6" stop-color="#5f6973"/>
      <stop offset="1" stop-color="#2a3138"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11171d"/>
      <stop offset="1" stop-color="#070a0d"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2632"/>
      <stop offset=".5" stop-color="#05080b"/>
      <stop offset="1" stop-color="#121a22"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f1419"/>
      <stop offset=".5" stop-color="#232b33"/>
      <stop offset="1" stop-color="#0f1419"/>
    </linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4552"/>
      <stop offset="1" stop-color="#161c22"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5d6b77"/>
      <stop offset=".5" stop-color="#dfe8ee"/>
      <stop offset="1" stop-color="#4c5964"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
    <pattern id="mat" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0v40" fill="none" stroke="#fcb040" stroke-opacity=".07" stroke-width="1.2"/></pattern>
  </defs>

  <rect width="1200" height="600" fill="#05070a"/>
  <rect width="1200" height="600" fill="url(#mat)"/>
  <rect width="1200" height="600" fill="url(#light)"/>
  <rect width="1200" height="600" fill="url(#pool)"/>

  <!-- tweezers -->
  <g transform="rotate(20 330 460)">
    <path d="M150 452l300 -6 0 6 -300 14z" fill="url(#steel)"/>
    <path d="M150 466l300 2 0 6 -300 -2z" fill="url(#steel)" opacity=".85"/>
  </g>
  <!-- spudger -->
  <g transform="rotate(-14 1000 500)">
    <rect x="900" y="490" width="220" height="14" rx="7" fill="#0f2f45" stroke="#29aae1" stroke-opacity=".6"/>
  </g>

  <ellipse cx="730" cy="480" rx="230" ry="40" fill="#000" opacity=".75" filter="url(#soft)"/>

  <!-- band (top and bottom, running out of frame) -->
  <path d="M640 -10h170l-14 150H654z" fill="url(#band)" stroke="#fcb040" stroke-opacity=".25"/>
  <path d="M654 420h142l14 200H640z" fill="url(#band)" stroke="#fcb040" stroke-opacity=".25"/>
  <g stroke="#000" stroke-opacity=".5" stroke-width="2"><path d="M660 40h130M662 80h126M664 470h122M662 520h126"/></g>

  <!-- watch case, opened -->
  <g transform="translate(600 120)">
    <rect x="0" y="0" width="250" height="300" rx="70" fill="url(#case)" stroke="#fde3b4" stroke-opacity=".6" stroke-width="2"/>
    <rect x="16" y="16" width="218" height="268" rx="58" fill="url(#inner)"/>
    <!-- crown and button -->
    <rect x="248" y="96" width="20" height="44" rx="8" fill="url(#steel)"/>
    <rect x="250" y="168" width="10" height="46" rx="4" fill="#6b7680"/>
    <!-- battery -->
    <rect x="46" y="44" width="158" height="104" rx="16" fill="url(#cell)" stroke="#fcb040" stroke-width="2" stroke-opacity=".8" filter="url(#glow)"/>
    <rect x="62" y="62" width="74" height="9" rx="4" fill="#fcb040" opacity=".85"/>
    <rect x="62" y="80" width="50" height="6" rx="3" fill="#9fb0bd" opacity=".5"/>
    <text x="62" y="128" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#c9d4dc" opacity=".7">Li-ion</text>
    <!-- board + taptic -->
    <rect x="46" y="164" width="96" height="92" rx="12" fill="#0e2526" stroke="#2de0c0" stroke-opacity=".4"/>
    <rect x="66" y="184" width="40" height="32" rx="3" fill="#1b2026"/>
    <g fill="#c7a457"><circle cx="122" cy="236" r="4"/><circle cx="66" cy="236" r="4"/></g>
    <rect x="152" y="164" width="52" height="92" rx="10" fill="#1e252c" stroke="#5cc4ee" stroke-opacity=".5"/>
    <path d="M160 190h36M160 210h36M160 230h36" stroke="#5cc4ee" stroke-opacity=".4"/>
    <!-- flex cable to lifted display -->
    <path d="M150 40C190 -40 250 -30 268 92" fill="none" stroke="#c99a3c" stroke-width="14" stroke-opacity=".9"/>
    <path d="M150 40C190 -40 250 -30 268 92" fill="none" stroke="#f4cf86" stroke-width="2" stroke-dasharray="3 5"/>
  </g>

  <!-- display lifted off -->
  <g transform="translate(860 40) rotate(16 120 140)">
    <rect x="0" y="0" width="230" height="276" rx="62" fill="url(#glass)" stroke="#fcb040" stroke-width="2.5" filter="url(#glow)"/>
    <rect x="18" y="18" width="194" height="240" rx="48" fill="#020406" stroke="#fcb040" stroke-opacity=".3"/>
    <!-- watch face -->
    <text x="115" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="58" font-weight="700" fill="#fcb040" opacity=".95">10:09</text>
    <circle cx="115" cy="190" r="26" fill="none" stroke="#29aae1" stroke-width="6" stroke-dasharray="120 60" opacity=".9"/>
    <path d="M30 26c40-14 120-14 170 4" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="2"/>
  </g>

  <!-- screws -->
  <g fill="#8fa1ae" stroke="#dfe8ee" stroke-width="1"><circle cx="520" cy="300" r="6"/><circle cx="545" cy="330" r="5"/></g>
</svg>
